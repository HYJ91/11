<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>招聘看板 - 分公司入口</title>
<style>
  body { font-family:"PingFang SC","Microsoft YaHei",sans-serif; background:#f5f7fa; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; }
  .box { background:#fff; border-radius:14px; box-shadow:0 8px 30px rgba(0,0,0,.1); padding:40px 48px; text-align:center; max-width:420px; }
  h1 { font-size:20px; color:#1a1a2e; margin:0 0 10px; }
  p { font-size:14px; color:#666; line-height:1.7; margin:6px 0; }
  .spinner { width:36px; height:36px; border:4px solid #e2e8f0; border-top-color:#4361ee; border-radius:50%; margin:0 auto 18px; animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .err { color:#e63946; }
  button { margin-top:16px; padding:9px 26px; border:none; border-radius:8px; background:#4361ee; color:#fff; font-size:14px; font-weight:600; cursor:pointer; }
</style>
</head>
<body>
<div class="box">
  <div class="spinner" id="spin"></div>
  <h1>正在连接招聘看板…</h1>
  <p id="msg">正在获取最新入口，请稍候</p>
  <p id="tip" style="font-size:12px;color:#999;">如果长时间无响应，请点击下方按钮重试</p>
  <button onclick="location.reload()">重新连接</button>
</div>
<script>
(async function() {
  const TIP = document.getElementById('msg');
  const nocache = '?t=' + Date.now();
  // 依次尝试：GitHub API（无缓存，最新） → raw 直链
  const sources = [
    async () => {
      const r = await fetch('https://api.github.com/repos/HYJ91/11/contents/tunnel_url.json' + nocache, { cache: 'no-store' });
      if (!r.ok) throw new Error('api ' + r.status);
      const j = await r.json();
      const txt = atob(j.content.replace(/\n/g, ''));
      return JSON.parse(txt).url;
    },
    async () => {
      const r = await fetch('https://raw.githubusercontent.com/HYJ91/11/main/tunnel_url.json' + nocache, { cache: 'no-store' });
      if (!r.ok) throw new Error('raw ' + r.status);
      const j = await r.json();
      return j.url;
    }
  ];
  for (let i = 0; i < sources.length; i++) {
    try {
      const url = await sources[i]();
      if (url && /^https:\/\/.+\.trycloudflare\.com\/?$/.test(url)) {
        TIP.textContent = '连接成功，正在跳转…';
        location.replace(url);
        return;
      }
    } catch (e) { /* 尝试下一个源 */ }
  }
  TIP.textContent = '暂时连不上服务器（主电脑可能关机或网络异常）';
  TIP.className = 'err';
  document.getElementById('spin').style.display = 'none';
})();
</script>
</body>
</html>
